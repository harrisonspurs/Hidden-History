<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can't think of a name</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <link rel="stylesheet" href="style.css">
  <script src="places.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">

    <section id="home-screen">
      <header class="top">
        <h1>Can't think of a name</h1>
        <button id="finds-button" class="pill-link" type="button"></button>
      </header>

      <div class="pickers">
        <label class="picker">
          <span class="hidden-label">How are you getting there?</span>
          <select id="mode-select">
            <option value="walking">Walk</option>
            <option value="cycling">Bike</option>
            <option value="transit">Public transport</option>
          </select>
        </label>

        <label class="picker">
          <span class="hidden-label">What sort of place?</span>
          <select id="theme-select">
            <option value="anything">Anything</option>
            <option value="interesting">Interesting</option>
            <option value="churches">Churches</option>
            <option value="pubs">Pubs</option>
            <option value="memorials">Memorials</option>
            <option value="houses">Houses</option>
            <option value="industry">Industry</option>
          </select>
        </label>
      </div>

      <fieldset id="time-choices" class="choices">
        <legend class="hidden-label">How long have you got, there and back?</legend>
        <button type="button" data-value="15" aria-pressed="false">15 min</button>
        <button type="button" data-value="30" aria-pressed="true">30 min</button>
        <button type="button" data-value="60" aria-pressed="false">1 hr</button>
      </fieldset>

      <button id="go-button" class="main-button" type="button">Go</button>

      <div id="status" class="status" role="status" hidden>
        <p id="status-text"></p>
        <button id="demo-button" class="text-button" type="button" hidden>Use Manchester instead</button>
      </div>
    </section>


    <section id="hunt-screen" hidden>
      <div class="map-wrap">
        <div id="map" class="map"></div>
        <button id="recentre-button" class="map-button" type="button" hidden>Re-centre</button>
      </div>

      <div class="row">
        <div>
          <h2 id="distance" class="distance"></h2>
          <p id="route-time" class="quiet"></p>
          <p class="quiet">Unlocks within 50 m</p>
        </div>
        <p id="clue" class="tag" hidden></p>
      </div>

      <p id="hunt-note" class="quiet" hidden></p>

      <a id="transit-link" class="main-button" target="_blank" rel="noopener" hidden>Bus and train times</a>

      <div class="button-row button-row-gap">
        <button id="back-button" class="grey-button" type="button">Back</button>
        <button id="skip-button" class="grey-button" type="button">Skip</button>
      </div>

      <button id="test-arrive" class="text-button test-button" type="button">Test: arrive now</button>
    </section>


    <section id="story-screen" hidden>
      <img id="place-image" class="photo" alt="" hidden>

      <h2 id="place-name" class="place-name"></h2>

      <div class="row row-start">
        <p id="place-tag" class="tag" hidden></p>
        <p id="place-date" class="quiet"></p>
      </div>

      <p id="place-story" class="story"></p>

      <figure id="old-view" class="old-view" hidden>
        <img id="old-view-image" alt="">
        <figcaption id="old-view-caption"></figcaption>
      </figure>

      <a id="place-source" class="text-button" target="_blank" rel="noopener">From Wikipedia. Read more</a>

      <button id="again-button" class="main-button" type="button">Next place</button>

      <div class="button-row">
        <button id="story-home-button" class="grey-button" type="button">Home</button>
        <button id="story-finds-button" class="grey-button" type="button">Finds</button>
      </div>
    </section>


    <section id="finds-screen" hidden>
      <header class="top">
        <h2>Finds</h2>
        <button id="finds-back-button" class="pill-link" type="button">Back</button>
      </header>

      <p id="finds-empty" class="quiet" hidden>Nothing yet.</p>

      <div id="stats" class="stats">
        <p><strong id="stat-places"></strong> places</p>
        <p><strong id="stat-distance"></strong> covered</p>
        <p><strong id="stat-streak"></strong> day streak</p>
      </div>

      <div id="finds-map" class="map map-small"></div>

      <ul id="finds-list" class="finds-list"></ul>
    </section>

  </main>
</body>
</html>
