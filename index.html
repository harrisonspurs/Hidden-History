<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden History</title>

  <!-- Leaflet map library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
  <script src="places.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1 class="title">Hidden History</h1>

    <!-- Screen 1: choose how long -->
    <section id="home-screen">
      <p>Pick how long you've got and we'll send you somewhere with a story.</p>

      <p class="label">Walking or cycling?</p>
      <div class="options">
        <button class="mode-option selected" data-mode="walking">Walking</button>
        <button class="mode-option" data-mode="cycling">Cycling</button>
      </div>

      <p class="label">How long have you got?</p>
      <div class="options">
        <button class="time-option" data-minutes="15">15 mins</button>
        <button class="time-option selected" data-minutes="30">30 mins</button>
        <button class="time-option" data-minutes="60">1 hour</button>
      </div>

      <button id="go-button" class="main-button">Find somewhere</button>
      <p id="status" class="small"></p>

      <h2>Places you've found</h2>
      <ul id="found-list"></ul>
    </section>

    <!-- Screen 2: the map -->
    <section id="map-screen" hidden>
      <button id="back-button" class="link-button">Back</button>
      <h2>Something's out there...</h2>
      <p class="small">Head to the pin. The story unlocks when you get there.</p>

      <div id="map"></div>

      <p id="distance" class="distance"></p>

      <a id="directions-link" class="main-button" target="_blank">Get directions</a>
      <button id="test-arrive" class="small-button">I'm here (testing)</button>
    </section>

    <!-- Screen 3: the story -->
    <section id="story-screen" hidden>
      <p class="label">You found</p>
      <h2 id="place-name"></h2>
      <img id="place-image" hidden>
      <p id="place-story"></p>
      <p class="small">
        Source: <a id="place-source" target="_blank">Wikipedia</a>
      </p>
      <button id="again-button" class="main-button">Find another place</button>
    </section>
  </main>
</body>
</html>
